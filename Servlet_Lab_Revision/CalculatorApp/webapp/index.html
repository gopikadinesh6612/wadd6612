<html><body>
<h2>Calculator</h2>
<form action="calculate" method="post">
First Number: <input type="number" step="any" name="a" required><br><br>
Second Number: <input type="number" step="any" name="b" required><br><br>
Operation: <select name="op">
<option value="+">Addition</option><option value="-">Subtraction</option>
<option value="*">Multiplication</option><option value="/">Division</option>
</select><br><br><input type="submit" value="Calculate">
</form></body></html>
